<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شهرزاد زمانی | متخصص هوش مصنوعی & ارشد ژنتیک پزشکی - کلینیک آلیما</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gold: #D4AF37;
      --secondary-gold: #F3E5AB;
      --accent-warm: #C5A059;
      --bg-dark: #0f1115;
      --bg-card: #181b22;
      --bg-light-gold: #fdfbf7;
      --text-dark: #2c2c2c;
      --text-muted: #666;
      --accent-soft: #e2d2b4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: var(--bg-light-gold); color: var(--text-dark); line-height: 1.8; overflow-x: hidden; }
    
    header {
      background: linear-gradient(135deg, #1c1917 0%, #292524 100%);
      color: #fff;
      padding: 80px 20px;
      text-align: center;
      position: relative;
    }
    .header-content { max-width: 900px; margin: 0 auto; }
    .badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.2);
      color: var(--primary-gold);
      border: 1px solid var(--primary-gold);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    h1 { font-size: 2.8rem; margin-bottom: 15px; color: #fff; font-weight: 800; }
    p.subtitle { font-size: 1.2rem; color: #d6d3d1; margin-bottom: 30px; font-weight: 300; }
    
    .btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-primary { background: var(--primary-gold); color: #000; }
    .btn-primary:hover { background: var(--accent-warm); }
    .btn-outline { border: 1px solid var(--primary-gold); color: var(--primary-gold); }
    .btn-outline:hover { background: rgba(212, 175, 55, 0.1); }

    .container { max-width: 1100px; margin: 0 auto; padding: 60px 20px; }
    .section-title { text-align: center; font-size: 2rem; color: #1c1917; margin-bottom: 40px; position: relative; }
    .section-title::after {
      content: ''; display: block; width: 60px; height: 3px; background: var(--primary-gold); margin: 10px auto 0;
    }

    .video-section {
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      margin-bottom: 60px;
      border: 1px solid #f0e6d2;
    }
    .video-container { width: 100%; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 20px; }
    video { width: 100%; display: block; max-height: 500px; object-fit: cover; }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 60px; }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #f0e6d2;
      box-shadow: 0 5px 15px rgba(0,0,0,0.03);
    }
    .card h3 { color: #1c1917; margin-bottom: 15px; font-size: 1.3rem; border-bottom: 2px solid var(--secondary-gold); padding-bottom: 8px; }
    .card ul { list-style: none; }
    .card ul li { margin-bottom: 12px; position: relative; padding-right: 20px; }
